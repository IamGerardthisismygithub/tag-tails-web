<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tag-Tails Website Design</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Tag-Tails smart QR tags: when someone scans your pet's tag you get a text with the GPS location. Free tag, service £2.95/month.">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16181b; --ink-2:#4a4f57; --ink-3:#7a808a;
  --bg:#fbf8f2; --bg-2:#f3eee3; --card:#ffffff; --line:#e7e1d4;
  --blue:#70b8ff; --blue-deep:#0b6fd6; --amber:#dba41d; --amber-soft:#fff3d1;
  --green:#6ca870; --green-soft:#e4f1e4;
  --btn:#16181b; --btn-ink:#ffffff;
  --media-blue:linear-gradient(160deg,#d9ecff,#b8dcff); --media-amber:linear-gradient(160deg,#fff1c8,#f6d88a); --coords:#0b6fd6;
  --radius:22px; --shadow:0 18px 40px -22px rgba(22,24,27,.35);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#f3f1ec; --ink-2:#c3c7ce; --ink-3:#8d939c;
    --bg:#111315; --bg-2:#181b1e; --card:#1d2024; --line:#2c3035;
    --blue-deep:#8ec7ff; --amber-soft:#2c2412; --green-soft:#1b2a1c;
    --btn:#70b8ff; --btn-ink:#0c1117;
    --media-blue:linear-gradient(160deg,#12263a,#173450); --media-amber:linear-gradient(160deg,#2a2210,#3a2e12);
    --shadow:0 18px 40px -22px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
    --ink:#f3f1ec; --ink-2:#c3c7ce; --ink-3:#8d939c;
    --bg:#111315; --bg-2:#181b1e; --card:#1d2024; --line:#2c3035;
    --blue-deep:#8ec7ff; --amber-soft:#2c2412; --green-soft:#1b2a1c;
    --btn:#70b8ff; --btn-ink:#0c1117;
    --media-blue:linear-gradient(160deg,#12263a,#173450); --media-amber:linear-gradient(160deg,#2a2210,#3a2e12);
    --shadow:0 18px 40px -22px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Outfit,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px}
h1,h2,h3{line-height:1.08;letter-spacing:-.02em;margin:0}
h1{font-size:clamp(2.5rem,6vw,4.4rem);font-weight:800}
h2{font-size:clamp(2rem,4.2vw,3.1rem);font-weight:800}
h3{font-size:1.25rem;font-weight:700}
p{margin:0}
.lead{font-size:clamp(1.05rem,1.6vw,1.25rem);color:var(--ink-2)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;color:var(--blue-deep)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 26px;border-radius:999px;font-weight:700;font-size:1rem;text-decoration:none;background:var(--btn);color:var(--btn-ink);border:2px solid var(--btn);transition:transform .15s ease}
.btn:hover{transform:translateY(-2px)}
a:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn{transition:none}}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#16181b}
.section{padding-block:clamp(64px,9vw,120px)}

.preview-bar{background:var(--amber);color:#16181b;text-align:center;font-size:.85rem;font-weight:600;padding-block:7px;padding-inline:16px}
/* Header */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:28px;height:72px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-size:1.3rem}
.brand img{width:44px;height:44px}
.nav-links{display:flex;gap:26px;margin-left:12px}
.nav-links a{text-decoration:none;font-weight:500;color:var(--ink-2)}
.nav-links a:hover{color:var(--ink)}
.nav-cta{margin-left:auto;display:flex;gap:10px;align-items:center}
.nav-cta .signin{text-decoration:none;font-weight:600;padding:10px 14px}
.nav-cta .btn{padding:10px 20px}
.burger{display:none;margin-left:auto;background:none;border:0;padding:8px;color:var(--ink);cursor:pointer}
.mobile-menu{display:none;border-top:1px solid var(--line);padding-block:12px 20px}
.mobile-menu a{display:block;padding:12px 0;text-decoration:none;font-weight:600;font-size:1.1rem}
.mobile-menu .btn{margin-top:10px;width:100%}
@media (max-width:860px){
  .nav-links,.nav-cta{display:none}
  .burger{display:block}
  header.open .mobile-menu{display:block}
}

/* Hero */
.hero{padding-block:clamp(40px,6vw,80px) clamp(56px,8vw,100px)}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(32px,5vw,72px);align-items:center}
.hero h1 .hl{color:var(--blue-deep)}
.hero .lead{margin-top:22px;max-width:520px}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.hero-note{margin-top:18px;color:var(--ink-3);font-size:.95rem;display:flex;align-items:center;gap:8px}
.hero-note b{color:var(--ink)}
.hero-media{position:relative}
.hero-photo{border-radius:32px;overflow:hidden;aspect-ratio:4/5;background:var(--bg-2);box-shadow:var(--shadow)}
.hero-photo img{width:100%;height:100%;object-fit:cover}
.float{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;max-width:260px}
.float .ico{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.float small{display:block;color:var(--ink-3);font-size:.8rem}
.float strong{font-size:.95rem}
.float.f1{left:-28px;bottom:48px}
.float.f2{right:-20px;top:36px}
@media (max-width:860px){
  .hero-grid{grid-template-columns:1fr}
  .hero-media{max-width:460px;margin-inline:auto;width:100%}
  .float.f1{left:-6px}.float.f2{right:-6px}
}

/* Trust strip */
.strip{border-block:1px solid var(--line);background:var(--bg-2)}
.strip-inner{display:flex;flex-wrap:wrap;justify-content:space-around;gap:18px 40px;padding-block:26px}
.strip-item{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--ink-2)}

/* Two parts */
.center{text-align:center;max-width:720px;margin-inline:auto}
.center .lead{margin-top:18px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:56px}
.duo-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:34px;display:flex;flex-direction:column;gap:14px}
.duo-card .ico{width:56px;height:56px;border-radius:16px;display:grid;place-items:center}
.duo-card p{color:var(--ink-2)}
.plus{display:none}
@media (max-width:760px){.duo{grid-template-columns:1fr}}

/* Alternating features */
.feature{display:grid;grid-template-columns:1fr 1fr;gap:clamp(32px,6vw,90px);align-items:center}
.feature + .feature{margin-top:clamp(72px,10vw,130px)}
.feature.rev .f-media{order:-1}
.f-copy .lead{margin-top:18px}
.f-copy ul{list-style:none;padding:0;margin:24px 0 0;display:grid;gap:12px}
.f-copy li{display:flex;gap:12px;align-items:flex-start;color:var(--ink-2)}
.f-copy li svg{flex:none;margin-top:3px}
.f-copy .btn{margin-top:30px}
.f-media{border-radius:32px;min-height:420px;display:grid;place-items:center;padding:40px 24px;position:relative;overflow:hidden}
.f-media.blue{background:var(--media-blue)}
.f-media.amber{background:var(--media-amber)}
.f-media.photo{padding:0}
.f-media.photo img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
@media (max-width:860px){
  .feature{grid-template-columns:1fr}
  .feature.rev .f-media{order:0}
  .f-media{min-height:340px}
}

/* Phone mockup */
.phone{width:260px;max-width:100%;background:#16181b;border-radius:38px;padding:12px;box-shadow:0 30px 60px -25px rgba(0,0,0,.5)}
.screen{background:#f4f5f7;border-radius:28px;padding:18px 14px 22px;min-height:400px;color:#16181b}
.screen .bar{display:flex;justify-content:space-between;font-size:.72rem;font-weight:600;color:#555;padding:0 6px 14px}
.sms-head{text-align:center;font-size:.78rem;color:#777;margin-bottom:12px}
.bubble{background:#e5e7eb;border-radius:18px 18px 18px 6px;padding:11px 13px;font-size:.84rem;line-height:1.4;margin-bottom:10px}
.bubble b{display:block;margin-bottom:2px}
.map{height:120px;border-radius:14px;margin:4px 0 10px;background:
  radial-gradient(circle at 58% 48%,#e5484d 0 7px,#fff 7px 10px,transparent 10px),
  linear-gradient(90deg,transparent 46%,#fff 46% 50%,transparent 50%),
  linear-gradient(0deg,transparent 58%,#fff 58% 63%,transparent 63%),
  linear-gradient(35deg,transparent 30%,#fff 30% 33%,transparent 33%),
  #cfe6cf}
.coords{font-family:ui-monospace,Menlo,monospace;font-size:.74rem;color:var(--coords)}

/* Profile mockup */
.profile{width:300px;max-width:100%;background:#fff;color:#16181b;border-radius:26px;overflow:hidden;box-shadow:0 30px 60px -25px rgba(0,0,0,.45)}
.profile .cover{height:170px;background:url(img/orla-pose.jpg) center 30%/cover}
.profile .body{padding:18px 20px 22px}
.profile .name{display:flex;justify-content:space-between;align-items:center}
.profile .tag{font-size:.72rem;font-weight:700;background:#e4f1e4;color:#3d7a42;padding:4px 10px;border-radius:999px}
.profile .meta{color:#6b7078;font-size:.88rem;margin-top:2px}
.profile .rows{margin-top:14px;display:grid;gap:8px}
.profile .row{display:flex;gap:10px;font-size:.85rem;background:#f5f3ee;border-radius:12px;padding:9px 12px}
.profile .call{margin-top:14px;background:#16181b;color:#fff;text-align:center;border-radius:999px;padding:11px;font-weight:700;font-size:.9rem}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px;margin-top:56px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px;display:flex;flex-direction:column;gap:12px}
.card .ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center}
.card p{color:var(--ink-2);font-size:.97rem}

/* Pricing */
.pricing{background:var(--bg-2)}
.price-card{max-width:880px;margin:56px auto 0;display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:32px;overflow:hidden;box-shadow:var(--shadow)}
.price-side{padding:40px}
.price-side + .price-side{border-left:1px solid var(--line)}
.price-label{font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;font-size:.8rem}
.price{font-size:3.4rem;font-weight:800;letter-spacing:-.03em;margin-top:6px}
.price small{font-size:1rem;font-weight:500;color:var(--ink-3)}
.price-side ul{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:10px}
.price-side li{display:flex;gap:10px;color:var(--ink-2)}
.price-side .btn{margin-top:28px;width:100%}
@media (max-width:760px){.price-card{grid-template-columns:1fr}.price-side + .price-side{border-left:0;border-top:1px solid var(--line)}}

/* Reviews */
.reviews{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin-top:56px}
.review{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:28px;display:flex;flex-direction:column;gap:14px}
.stars{color:var(--amber);letter-spacing:2px}
.review p{color:var(--ink-2)}
.review .who{margin-top:auto;display:flex;align-items:center;gap:12px;font-weight:700}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#16181b}

/* Mission + CTA */
.mission{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(32px,6vw,80px);align-items:center}
.mission-photo{border-radius:32px;overflow:hidden;aspect-ratio:4/3}
.mission-photo img{width:100%;height:100%;object-fit:cover}
.mission .lead{margin-top:18px}
@media (max-width:860px){.mission{grid-template-columns:1fr}}
.cta{background:#16181b;color:#fff;border-radius:36px;padding:clamp(40px,7vw,80px);display:grid;grid-template-columns:1.2fr .8fr;gap:32px;align-items:center;position:relative;overflow:hidden}
.cta h2{color:#fff}
.cta p{color:#c3c7ce;margin-top:14px;font-size:1.1rem}
.cta .actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:flex-end}
.cta .btn.ghost{color:#fff;border-color:#3a3f46}
.cta .logo-big{position:absolute;right:-60px;bottom:-80px;width:260px;opacity:.12}
@media (max-width:760px){.cta{grid-template-columns:1fr}.cta .actions{justify-content:flex-start}}

/* Footer */
footer{padding-block:64px 36px;border-top:1px solid var(--line);margin-top:clamp(64px,9vw,120px)}
.foot{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px}
.foot h4{margin:0 0 14px;font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.foot a{display:block;text-decoration:none;color:var(--ink-2);padding:4px 0}
.foot a:hover{color:var(--ink)}
.foot .about{color:var(--ink-2);margin-top:14px;max-width:300px}
.foot-bottom{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:center;margin-top:48px;padding-top:24px;border-top:1px solid var(--line);color:var(--ink-3);font-size:.9rem}
.lang{display:flex;align-items:center;gap:8px}
.lang select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
@media (max-width:760px){.foot{grid-template-columns:1fr 1fr}.foot > div:first-child{grid-column:1/-1}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="check" viewBox="0 0 20 20"><circle cx="10" cy="10" r="10" fill="#6ca870"/><path d="M6 10.4l2.6 2.6L14.2 7.4" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<div class="preview-bar">Design preview for Tag-Tails · not the live website</div>
<header id="top">
  <div class="wrap nav">
    <a class="brand" href="#top"><img src="img/logo.svg" alt="">Tag-Tails</a>
    <nav class="nav-links">
      <a href="#features" data-i18n="nav.features"></a>
      <a href="#pricing" data-i18n="nav.pricing"></a>
      <a href="#reviews" data-i18n="nav.reviews"></a>
      <a href="#mission" data-i18n="nav.about"></a>
    </nav>
    <div class="nav-cta">
      <a class="signin" href="https://tag-tails.co.uk/auth/sign-in" data-i18n="nav.signin"></a>
      <a class="btn" href="https://tag-tails.co.uk/product/tag" data-i18n="cta.free"></a>
    </div>
    <button class="burger" aria-label="Menu" onclick="document.getElementById('top').classList.toggle('open')">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>
  <div class="wrap mobile-menu" onclick="if(event.target.tagName==='A')document.getElementById('top').classList.remove('open')">
    <a href="#features" data-i18n="nav.features"></a>
    <a href="#pricing" data-i18n="nav.pricing"></a>
    <a href="#reviews" data-i18n="nav.reviews"></a>
    <a href="#mission" data-i18n="nav.about"></a>
    <a href="https://tag-tails.co.uk/auth/sign-in" data-i18n="nav.signin"></a>
    <a class="btn" href="https://tag-tails.co.uk/product/tag" data-i18n="cta.free"></a>
  </div>
</header>

<main>
  <!-- Hero -->
  <section class="hero">
    <div class="wrap hero-grid">
      <div>
        <span class="eyebrow" data-i18n="hero.eyebrow"></span>
        <h1 style="margin-top:14px" data-i18n-html="hero.title"></h1>
        <p class="lead" data-i18n="hero.lead"></p>
        <div class="hero-actions">
          <a class="btn" href="https://tag-tails.co.uk/product/tag" data-i18n="cta.free"></a>
          <a class="btn ghost" href="#how" data-i18n="cta.how"></a>
        </div>
        <p class="hero-note"><svg width="18" height="18"><use href="#check"/></svg><span data-i18n-html="hero.note"></span></p>
      </div>
      <div class="hero-media">
        <div class="hero-photo"><img src="img/orla-pose.jpg" alt="" data-i18n-alt="hero.alt"></div>
        <div class="float f1">
          <div class="ico" style="background:var(--green-soft)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6ca870" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></div>
          <div><small data-i18n="hero.float1a"></small><strong data-i18n="hero.float1b"></strong></div>
        </div>
        <div class="float f2">
          <div class="ico" style="background:var(--amber-soft)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#dba41d" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h2v2h-2zM18 18h2v2h-2zM14 18h1M18 14h2"/></svg></div>
          <div><small data-i18n="hero.float2a"></small><strong data-i18n="hero.float2b"></strong></div>
        </div>
      </div>
    </div>
  </section>

  <!-- Trust strip -->
  <div class="strip">
    <div class="wrap strip-inner">
      <div class="strip-item"><svg width="20" height="20"><use href="#check"/></svg><span data-i18n="strip.1"></span></div>
      <div class="strip-item"><svg width="20" height="20"><use href="#check"/></svg><span data-i18n="strip.2"></span></div>
      <div class="strip-item"><svg width="20" height="20"><use href="#check"/></svg><span data-i18n="strip.3"></span></div>
      <div class="strip-item"><svg width="20" height="20"><use href="#check"/></svg><span data-i18n="strip.4"></span></div>
    </div>
  </div>

  <!-- How it works: tag + service -->
  <section class="section" id="how">
    <div class="wrap">
      <div class="center">
        <span class="eyebrow" data-i18n="how.eyebrow"></span>
        <h2 style="margin-top:12px" data-i18n="how.title"></h2>
        <p class="lead" data-i18n="how.lead"></p>
      </div>
      <div class="duo">
        <div class="duo-card">
          <div class="ico" style="background:#16181b"><img src="img/logo.svg" alt="" width="40" height="40"></div>
          <h3 data-i18n="how.tagT"></h3>
          <p data-i18n="how.tagP"></p>
        </div>
        <div class="duo-card">
          <div class="ico" style="background:var(--amber-soft)"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#dba41d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8M8 13h5"/></svg></div>
          <h3 data-i18n="how.svcT"></h3>
          <p data-i18n="how.svcP"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- Feature showcase -->
  <section class="section" id="features" style="padding-top:0">
    <div class="wrap">
      <div class="feature">
        <div class="f-copy">
          <span class="eyebrow" data-i18n="f1.eyebrow"></span>
          <h2 style="margin-top:12px" data-i18n="f1.title"></h2>
          <p class="lead" data-i18n="f1.lead"></p>
          <ul>
            <li><svg width="20" height="20"><use href="#check"/></svg><span data-i18n="f1.b1"></span></li>
            <li><svg width="20" height="20"><use href="#check"/></svg><span data-i18n="f1.b2"></span></li>
            <li><svg width="20" height="20"><use href="#check"/></svg><span data-i18n="f1.b3"></span></li>
          </ul>
        </div>
        <div class="f-media blue">
          <div class="phone"><div class="screen">
            <div class="bar"><span>9:41</span><span>●●● 5G</span></div>
            <div class="sms-head">Tag-Tails</div>

const DEFAULT = "en-GB";
const LS_KEY = "tagtails-lang";

function pickLang(){
  try { const saved = localStorage.getItem(LS_KEY); if (saved && I18N[saved]) return saved; } catch(e){}
  const prefs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || DEFAULT];
  for (const p of prefs){
    const base = String(p).toLowerCase().split("-")[0];
    if (base === "en") return DEFAULT;          // any English → British English
    if (I18N[base]) return base;
  }
  return DEFAULT;
}

function applyLang(lang){
  const d = I18N[lang] || I18N[DEFAULT], en = I18N[DEFAULT];
  const t = k => d[k] ?? en[k] ?? "";
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-html]").forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
  document.querySelectorAll("[data-i18n-alt]").forEach(el => el.alt = t(el.dataset.i18nAlt));
  document.getElementById("langSel").value = lang;
}

const sel = document.getElementById("langSel");
Object.keys(I18N).forEach(k => sel.add(new Option(I18N[k]._name, k)));
sel.addEventListener("change", () => {
  try { localStorage.setItem(LS_KEY, sel.value); } catch(e){}
  applyLang(sel.value);
});
document.getElementById("year").textContent = new Date().getFullYear();
applyLang(pickLang());
</script>
